<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Extension with Content Script</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 400px;
      max-height: 600px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #202124;
    }
    
    .header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dadce0;
    }
    
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    
    .input-group {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .button:hover {
      background: #1557b0;
    }
    
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .button-secondary {
      background: transparent;
      color: #1a73e8;
      border: 1px solid #dadce0;
    }
    
    .button-secondary:hover {
      background: #f1f3f4;
    }
    
    .results {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 12px;
    }
    
    .data-section {
      margin-bottom: 16px;
    }
    
    .data-section:last-child {
      margin-bottom: 0;
    }
    
    .data-section h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #5f6368;
    }
    
    .data-section ul {
      list-style: none;
      padding-left: 0;
    }
    
    .data-section li {
      padding: 4px 0;
      border-bottom: 1px solid #f1f3f4;
    }
    
    .data-section li:last-child {
      border-bottom: none;
    }
    
    .data-section a {
      color: #1a73e8;
      text-decoration: none;
    }
    
    .data-section a:hover {
      text-decoration: underline;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .status.success {
      background: #e6f4ea;
      color: #34a853;
    }
    
    .status.error {
      background: #fce8e8;
      color: #ea4335;
    }
    
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    
    .loading.active {
      display: flex;
    }
    
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #dadce0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">Content Script Extension</div>
  
  <div class="controls">
    <button class="button" id="extractBtn">Extract Data</button>
    <button class="button button-secondary" id="injectBtn">Inject Script</button>
  </div>
  
  <div class="controls">
    <div class="input-group">
      <input type="text" id="selector" placeholder="CSS selector (e.g., h1, .class)" value="h1">
      <button class="button" id="highlightBtn">Highlight</button>
    </div>
  </div>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
  </div>
  
  <div class="results" id="results">
    <p style="color: #5f6368; text-align: center;">
      Click "Extract Data" to analyze the current page
    </p>
  </div>
  
  <div id="status"></div>
  
  <script src="popup.js" type="module"></script>
</body>
</html>
