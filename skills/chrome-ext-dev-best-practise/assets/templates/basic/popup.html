<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Extension Popup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 350px;
      min-height: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #202124;
    }
    
    .header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dadce0;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .button:hover {
      background: #1557b0;
    }
    
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .button-secondary {
      background: transparent;
      color: #1a73e8;
      border: 1px solid #dadce0;
    }
    
    .button-secondary:hover {
      background: #f1f3f4;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .status.success {
      background: #e6f4ea;
      color: #34a853;
    }
    
    .status.error {
      background: #fce8e8;
      color: #ea4335;
    }
    
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    
    .loading.active {
      display: flex;
    }
    
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #dadce0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">My Extension</div>
  
  <div class="section">
    <button class="button" id="actionBtn">Perform Action</button>
    <button class="button button-secondary" id="optionsBtn">Options</button>
  </div>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
  </div>
  
  <div id="status"></div>
  
  <script src="popup.js" type="module"></script>
</body>
</html>
